</div>

<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent translate-x-[-100%] animate-[shimmer_2s_infinite]"></div>
</div>
</div>
<style>
                    @keyframes shimmer {
                        100% { transform: translateX(100%); }
                    }
                </style>
</div>
<div class="pt-stack-lg">
<p class="font-label-caps text-label-caps text-outline flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">lock</span>
                    SECURE DIAGNOSTIC ENVIRONMENT
                </p>

<script>
        // Simple script to cycle status messages and progress
        const statuses = [
            "Analyzing headline impact...",
            "Evaluating network strength...",
            "Scanning media richness...",
            "Assessing keyword density...",
            "Compiling final strategy..."
        ];
        
        const statusEl = document.getElementById('status-text');
        const progressFill = document.getElementById('progress-fill');
        const progressPercentage = document.getElementById('progress-percentage');
        
        let currentStep = 0;
        let progress = 45;

        const updateStatus = () => {
            if (currentStep >= statuses.length - 1) return;
            
            // Fade out
            statusEl.style.opacity = 0;
            
            setTimeout(() => {
                currentStep++;
                statusEl.textContent = statuses[currentStep];
                
                // Calculate progress
                progress = Math.min(98, progress + (Math.random() * 15 + 5));
                progressFill.style.width = `${progress}%`;
                progressPercentage.textContent = `${Math.round(progress)}%`;
                
                // Fade in
                statusEl.style.opacity = 1;
            }, 300); // Wait for fade out
        };

        // Cycle every 2-3 seconds
        setInterval(updateStatus, 2500);
    </script>
